name: auto-app

services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-bookworm
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rails:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: auto-app-rails:dev
    working_dir: /backend
    env_file:
      - .env
    ports:
      - "${RAILS_PORT}:3000"
    volumes:
      - ./backend:/backend
      - rails-bundle-cache:/usr/local/bundle
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["bash", "-lc", "bin/rails db:prepare && bin/rails server -b 0.0.0.0 -p 3000"]

  sidekiq:
    image: auto-app-rails:dev
    working_dir: /backend
    env_file:
      - .env
    volumes:
      - ./backend:/backend
      - rails-bundle-cache:/usr/local/bundle
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rails:
        condition: service_started
    command: ["bash", "-lc", "bundle exec sidekiq"]

  flutter:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: auto-app-flutter:dev
    working_dir: /frontend
    ports:
      - "${FLUTTER_PORT}:8080"
    volumes:
      - ./frontend:/frontend
      - flutter-pub-cache:/root/.pub-cache
    stdin_open: true
    tty: true
    command: ["flutter", "run", "-d", "web-server", "--web-hostname=0.0.0.0", "--web-port=8080"]

volumes:
  postgres-data:
  redis-data:
  rails-bundle-cache:
  flutter-pub-cache:

name: auto-app

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-bookworm
    restart: unless-stopped
    ports:
      - '${REDIS_PORT}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  rails:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: auto-app-rails:dev
    restart: unless-stopped
    init: true
    working_dir: /backend
    env_file:
      - .env
    ports:
      - '${RAILS_PORT}:3000'
    volumes:
      - ./backend:/backend
      - rails-bundle-cache:/usr/local/bundle
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "ruby", "-rsocket", "-e", "TCPSocket.new('127.0.0.1', 3000).close"]
      interval: 5s
      timeout: 5s
      retries: 12

  sidekiq:
    image: auto-app-rails:dev
    restart: unless-stopped
    init: true
    working_dir: /backend
    env_file:
      - .env
    volumes:
      - ./backend:/backend
      - rails-bundle-cache:/usr/local/bundle
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rails:
        condition: service_healthy
    command: ['bash', '-lc', 'exec bundle exec sidekiq']

  flutter:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: auto-app-flutter:dev
    restart: unless-stopped
    init: true
    working_dir: /frontend
    ports:
      - '${FLUTTER_PORT}:8080'
    volumes:
      - ./frontend:/frontend
      - flutter-pub-cache:/root/.pub-cache

volumes:
  postgres-data:
  redis-data:
  rails-bundle-cache:
  flutter-pub-cache:
